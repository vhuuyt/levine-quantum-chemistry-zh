name: Build book PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Typst and book fonts
        shell: bash
        run: bash scripts/install-build-dependencies.sh

      - name: Compile PDF
        shell: bash
        run: |
          mkdir -p dist
          .typst/typst compile --ignore-system-fonts --font-path .fonts \
            book.typ dist/levine-quantum-chemistry-zh.pdf
          test -s dist/levine-quantum-chemistry-zh.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: levine-quantum-chemistry-zh-pdf
          path: dist/levine-quantum-chemistry-zh.pdf
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: levine-quantum-chemistry-zh-pdf
          path: dist
      - name: Publish PDF to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=dist/levine-quantum-chemistry-zh.pdf
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag \
              --title "《量子化学》第七版 · 中文翻译 $GITHUB_REF_NAME" --generate-notes
          fi
